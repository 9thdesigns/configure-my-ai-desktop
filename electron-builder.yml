# Build + packaging for the macOS app.
#
# Artifact names are part of the site's wire contract: the /download page on
# configuremyai.com links to
#   .../releases/latest/download/ConfigureMyAI-arm64.dmg
#   .../releases/latest/download/ConfigureMyAI-x64.dmg
# so `artifactName` below must not change casually — renaming it breaks every
# published download button until the Rails page is updated to match.

appId: com.configuremyai.desktop
productName: Configure My AI
copyright: © 9th Designs

directories:
  buildResources: build
  output: dist

files:
  - src/**/*
  - package.json

# Runs after each arch is packaged. For unsigned builds it ad-hoc signs the
# .app so Apple Silicon will launch it (an entirely unsigned app reads as
# "damaged"); for signed builds it stands aside. See build/afterPack.js.
afterPack: build/afterPack.js

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  darkModeSupport: true
  # Hardened runtime is required for notarization; harmless without it.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: "ConfigureMyAI-${arch}.${ext}"
  # dmg is what people download; zip is what electron-updater applies.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

# Notarization runs automatically when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD
# and APPLE_TEAM_ID are present in the environment (the release workflow
# passes them through from repository secrets), and is skipped when absent.

publish:
  provider: github
  owner: 9thdesigns
  repo: configure-my-ai-desktop
  # Default (draft) publishing — deliberately NOT releaseType: release.
  # electron-builder creates ONE draft release, uploads every asset to it by
  # id, then flips it to published in a single final step. releaseType:
  # release instead uploads into a live release and re-resolves it on each
  # parallel upload; that race fires a stray `POST /releases` with a bad tag
  # and GitHub rejects it — "422 Published releases must have a valid tag" —
  # after the DMGs are up but before latest-mac.yml, which is what left
  # auto-update broken on v0.1.1 and v0.1.2. The draft finalize has no such
  # race. (releaseType: release was only needed for the hand-published
  # v0.1.0; a version electron-builder creates itself must stay on draft.)
