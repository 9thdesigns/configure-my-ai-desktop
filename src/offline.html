<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Configure My AI</title>
  <style>
    :root { color-scheme: light dark; }
    /* The window has no title bar to drag by (see src/preload.js). The preload
       installs a strip on every page it shows, this one included; this is the
       same strip in the markup, so the page the user sees when the network is
       gone is movable even if nothing else on it has run. Height matches
       TITLEBAR_HEIGHT in src/main.js. */
    .titlebar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 40px;
      z-index: 2147483647;
      -webkit-app-region: drag;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      /* The web app's body (pane) colour, so the window doesn't flash a
         different page colour while offline. */
      background: #ffffff;
      color: #231d1b;
      /* The web app's primary button (t419u button system): solid ink. */
      --btn-bg: #1c1c1c;
      --btn-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #f4f1ef; --btn-bg: #f5f5f5; --btn-ink: #0a0a0a; }
    }
    main { text-align: center; padding: 48px 24px; max-width: 26rem; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; opacity: 0.75; line-height: 1.5; }
    /* Primary, size md: 32px tall, 14px medium text, rounded-lg, soft press. */
    button {
      appearance: none;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      height: 32px;
      padding: 0 14px;
      border: 0;
      border-radius: 10px;
      background: var(--btn-bg);
      color: var(--btn-ink);
      cursor: pointer;
      transition: transform 80ms ease-out, opacity 80ms ease-out;
    }
    button:hover { opacity: 0.88; }
    button:active { transform: scale(0.98); opacity: 0.8; }
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid var(--btn-bg); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
      button:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="titlebar" aria-hidden="true"></div>
  <main>
    <h1>Can’t reach Configure My AI</h1>
    <p>Check your connection — this app is a window onto configuremyai.com, so it needs the network. It retries on its own every few seconds.</p>
    <button type="button" id="retry">Retry now</button>
  </main>
  <script src="offline.js"></script>
</body>
</html>
