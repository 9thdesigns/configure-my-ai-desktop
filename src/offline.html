<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Configure My AI</title>
  <style>
    :root { color-scheme: light dark; }
    /* The window has no title bar to drag by (see src/preload.js). The preload
       installs a strip on every page it shows, this one included; this is the
       same strip in the markup, so the page the user sees when the network is
       gone is movable even if nothing else on it has run. Height matches
       TITLEBAR_HEIGHT in src/main.js. */
    .titlebar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 40px;
      z-index: 2147483647;
      -webkit-app-region: drag;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5f4;
      color: #231d1b;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #100c0b; color: #f4f1ef; }
    }
    main { text-align: center; padding: 48px 24px; max-width: 26rem; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; opacity: 0.75; line-height: 1.5; }
    button {
      font: inherit;
      padding: 10px 22px;
      border: 0;
      border-radius: 999px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="titlebar" aria-hidden="true"></div>
  <main>
    <h1>Can’t reach Configure My AI</h1>
    <p>Check your connection — this app is a window onto configuremyai.com, so it needs the network. It retries on its own every few seconds.</p>
    <button type="button" onclick="retry()">Retry now</button>
  </main>
  <script>
    function retry () { location.replace('https://configuremyai.com/welcome') }
    addEventListener('online', retry)
    setInterval(function () { if (navigator.onLine) retry() }, 10000)
  </script>
</body>
</html>
