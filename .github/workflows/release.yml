# Tag → DMG → GitHub Release.
#
# Push a tag like v0.1.0 and this builds Apple Silicon and Intel DMGs (plus
# the zips electron-updater applies) and publishes them to a GitHub Release.
# The /download page on configuremyai.com links to the `latest` release's
# assets, so publishing a release IS shipping.
#
# Signing and notarization are driven entirely by repository secrets: with
# none set, the build is ad-hoc signed (runs locally, but downloaders must
# right-click → Open past Gatekeeper); with all five set, the DMG is
# Developer ID signed and notarized — the real distribution path.
#
#   CSC_LINK                     base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD             password for that .p12
#   APPLE_ID                     Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
#   APPLE_TEAM_ID                the 10-character team identifier

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Pre-create the target release so electron-builder only ever UPLOADS
      # into it — it never calls POST /releases itself. This is the fix for
      # both multi-arch failure modes we hit: with releaseType: release the
      # two parallel arch uploads raced to create the release and GitHub
      # returned "422 Published releases must have a valid tag"; with the
      # default draft flow each arch made its own separate draft because a
      # draft can't be looked up by tag. A single published release that
      # already exists resolves cleanly for every upload. Idempotent: skipped
      # if the release is already there.
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            echo "Creating release $tag at $GITHUB_SHA."
            gh release create "$tag" \
              --title "$tag" \
              --notes "Configure My AI $tag" \
              --target "$GITHUB_SHA"
          fi

      # When the five signing secrets are absent they arrive here as empty
      # strings, and electron-builder mis-reads an empty CSC_LINK as a
      # certificate *path* — resolving it to the project dir and failing with
      # "<dir> not a file". So branch explicitly: sign when a certificate is
      # present, otherwise unset the empties and turn identity auto-discovery
      # off for a clean unsigned (ad-hoc) build. Downloaders of an unsigned
      # build open it past Gatekeeper once; add the secrets to get notarized
      # builds that just open. See README.md.
      - name: Build and publish DMGs
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Developer ID certificate present — signing."
            npx electron-builder --mac --publish always
          else
            echo "No signing certificate — building an unsigned (ad-hoc) release."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --publish always
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
